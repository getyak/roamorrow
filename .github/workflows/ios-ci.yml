name: iOS CI

on:
  # Only run on main pushes — feature/dual-agent branches are validated via
  # their pull_request. Pushing CI on every '**' branch flooded the scarce
  # macOS runner queue (each distinct ref = its own concurrency group).
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-parity:
    name: TS↔Swift Schema Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TS↔Swift schema parity
        run: pnpm parity:check

  build-and-test:
    name: Build iOS app (placeholder secrets)
    runs-on: macos-latest
    # Baseline SDK build + 2015 unit tests + native UI startup exceeded 30m.
    # Keep all acceptance steps and their individual test timeouts enabled.
    # Retain existing full gates plus long-history and profile accessibility UI.
    timeout-minutes: 55
    needs: [schema-parity]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create placeholder .env
        env:
          # Optional: inject the real Amap key from repo secrets so the
          # CI build matches what TestFlight ships. Empty when the secret
          # isn't configured (open-source forks) — AmapPOIService still
          # builds and the wire-format contract tests still run because
          # they decode inline JSON fixtures, not live network responses.
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
        run: |
          printf 'DEEPSEEK_API_KEY=\n' > .env
          printf 'DEEPSEEK_BASE_URL=https://api.deepseek.com/v1\n' >> .env
          printf 'DEEPSEEK_MODEL=deepseek-flash\n' >> .env
          printf 'SENTRY_DSN=\n' >> .env
          printf 'AMAP_API_KEY=%s\n' "${AMAP_API_KEY}" >> .env
          printf 'DEVELOPMENT_TEAM=%s\n' "$DEVELOPMENT_TEAM" >> .env

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          selected="$(python3 scripts/ios/select-simulator.py \
            --json-file "$RUNNER_TEMP/simulators.json" \
            --preferred "iPhone 17 Pro")"
          python3 - "$selected" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          name = payload["name"]
          version = payload["ios_version"]
          udid = payload["udid"]
          print(f"Selected {name} on iOS {version}: {udid}")
          with open(sys.argv[2], "a") as output:
              output.write(f"udid={udid}\n")
          PY

      # Regenerate the project from project.yml so CI compiles the exact same
      # source set TestFlight does. The committed .xcodeproj drifts out of sync
      # (xcodegen owns it — see CLAUDE.md), which previously let new files with
      # compile errors pass CI while failing the TestFlight archive.
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Generate .xcodeproj
        run: |
          cd apps/ios
          xcodegen generate --spec project.yml

      - name: Build iOS App
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          cd apps/ios
          xcodebuild build \
            -project SoloCompass.xcodeproj \
            -scheme SoloCompass \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

          echo "✅ BUILD SUCCEEDED"

      - name: Run Unit Tests
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          cd apps/ios
          xcodebuild test \
            -project SoloCompass.xcodeproj \
            -scheme SoloCompass \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log

          echo "✅ TESTS PASSED"

      - name: Run account onboarding UI tests
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          cd apps/ios
          xcodebuild test \
            -project SoloCompass.xcodeproj \
            -scheme AccountAcceptance \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:CompanionAcceptanceUITests/AccountOnboardingUITests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            -resultBundlePath "$RUNNER_TEMP/account-onboarding.xcresult" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee account-onboarding.log

      # Use only this runner's installed app container. The writer rejects local
      # machines and existing non-fixture conversations; no production test hook.
      - name: Seed V4 public-place UI fixture
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v4-native"
          # xcodebuild may shut down its destination after account UI tests.
          # Reuse that exact device and wait for it before container/IO access.
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          V4_APP_CONTAINER="$(xcrun simctl get_app_container "$SIMULATOR_UDID" com.solocompass.app data)"
          python3 scripts/qa/seed-v4-ui-fixture.py \
            --container "$V4_APP_CONTAINER" \
            --receipt "$RUNNER_TEMP/v4-native/fixture-receipt.json"

      - name: Run V4 native interaction tests and record video
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          V4_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          V4_VIDEO_PID=""
          finish_video() {
            if [[ -z "$V4_VIDEO_PID" ]]; then return 0; fi
            local video_pid="$V4_VIDEO_PID"
            V4_VIDEO_PID=""
            if kill -0 "$video_pid" 2>/dev/null; then
              kill -INT "$video_pid" 2>/dev/null || true
            fi
            (
              sleep 15
              kill -TERM "$video_pid" 2>/dev/null || true
              sleep 5
              kill -KILL "$video_pid" 2>/dev/null || true
            ) &
            local watchdog_pid=$!
            local video_status=0
            wait "$video_pid" || video_status=$?
            kill "$watchdog_pid" 2>/dev/null || true
            wait "$watchdog_pid" 2>/dev/null || true
            printf '%s\n' "$video_status" > "$RUNNER_TEMP/v4-native/recording-exit-status.txt"
            if [[ "$video_status" != 0 && "$video_status" != 130 ]]; then
              echo "Native recording did not finish cleanly: $video_status" >&2
              return 1
            fi
          }
          trap 'v4_exit=$?; trap - EXIT; finish_video || v4_exit=1; exit "$v4_exit"' EXIT
          python3 - "$RUNNER_TEMP/v4-native/recording.json" <<'PY'
          import json, os, sys, time
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "capture_requested_epoch": time.time(),
              "checkout_sha": os.environ["GITHUB_SHA"],
              "pr_head_sha": os.environ["V4_PR_HEAD_SHA"],
              "scope": "Native CI Simulator UI with public bundled places and explicitly seeded local history; no model calls."
          }, indent=2) + "\n")
          PY
          xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 \
            "$RUNNER_TEMP/v4-native/native-interactions.mp4" \
            > "$RUNNER_TEMP/v4-native/recording.log" 2>&1 &
          V4_VIDEO_PID=$!
          cd apps/ios
          xcodebuild test-without-building \
            -project SoloCompass.xcodeproj \
            -scheme AccountAcceptance \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:CompanionAcceptanceUITests/V4NavigationUITests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 90 \
            -maximum-test-execution-time-allowance 180 \
            -resultBundlePath "$RUNNER_TEMP/v4-native/interactions.xcresult" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee v4-navigation.log
          finish_video
          test -s "$RUNNER_TEMP/v4-native/native-interactions.mp4"
          swift ../../scripts/qa/validate-v4-recording.swift \
            "$RUNNER_TEMP/v4-native/native-interactions.mp4" \
            "$RUNNER_TEMP/v4-native/recording-validation.json"
          swift ../../scripts/qa/export-v4-preview.swift \
            "$RUNNER_TEMP/v4-native/native-interactions.mp4" \
            "$RUNNER_TEMP/v4-native/native-interactions-preview.mp4" \
            > "$RUNNER_TEMP/v4-native/preview-metadata.json"
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/v4-native/interactions.xcresult" \
            > "$RUNNER_TEMP/v4-native/test-summary.json"
          python3 - "$RUNNER_TEMP/v4-native/test-summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          assert result["passedTests"] == 3, result
          assert result["failedTests"] == 0 and result["skippedTests"] == 0, result
          print("V4 native interaction acceptance: 3 passed, 0 failed, 0 skipped")
          PY

      - name: Seed long conversation and empty profile (CI-owned device)
        id: chat_fixture
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          CHAT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          CHAT_CONTAINER="$(xcrun simctl get_app_container "$SIMULATOR_UDID" com.solocompass.app data)"
          # This job owns the ephemeral runner/device; shut down this exact
          # device so CFPreferences cannot race the marked fixture write.
          xcrun simctl shutdown "$SIMULATOR_UDID"
          python3 scripts/qa/seed-chat-performance-fixture.py \
            --container "$CHAT_CONTAINER" --receipt "$RUNNER_TEMP/chat-native/empty/fixture.json"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl ui "$SIMULATOR_UDID" appearance light
          xcrun simctl ui "$SIMULATOR_UDID" content_size large

      - name: Long conversation scroll, send and Me navigation
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          CHAT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Only boolean scroll/audio ownership diagnostics from this owned CI device;
          # never message text, anchor IDs, credentials or travel information.
          xcrun simctl spawn "$SIMULATOR_UDID" log stream --level debug --style compact \
            --predicate 'subsystem == "com.solocompass.chat-scroll" OR subsystem == "com.solocompass.audio-lifecycle"' \
            > "$RUNNER_TEMP/chat-native/scroll-intent.log" 2>&1 &
          CHAT_TRACE_PID=$!
          python3 scripts/qa/capture-chat-hang.py \
            --device "$SIMULATOR_UDID" \
            --log "$GITHUB_WORKSPACE/apps/ios/chat-and-me.log" \
            --output "$RUNNER_TEMP/chat-native/hang-diagnostics" &
          CHAT_HANG_PID=$!
          trap 'kill "$CHAT_TRACE_PID" "$CHAT_HANG_PID" 2>/dev/null || true; wait "$CHAT_HANG_PID" 2>/dev/null || true' EXIT
          cd apps/ios
          xcodebuild test-without-building \
            -project SoloCompass.xcodeproj -scheme AccountAcceptance \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:CompanionAcceptanceUITests/ChatAndMeUITests \
            -skip-testing:CompanionAcceptanceUITests/ChatAndMeUITests/testMeLongNameLargeTypeAndDarkAppearance \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            -resultBundlePath "$RUNNER_TEMP/chat-native/chat-and-me.xcresult" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO 2>&1 | tee chat-and-me.log

      - name: Seed populated profile with long name (CI-owned device)
        id: chat_populated_fixture
        if: ${{ always() && !cancelled() && steps.chat_fixture.outcome == 'success' }}
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          CHAT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          CHAT_CONTAINER="$(xcrun simctl get_app_container "$SIMULATOR_UDID" com.solocompass.app data)"
          xcrun simctl shutdown "$SIMULATOR_UDID"
          python3 scripts/qa/seed-chat-performance-fixture.py \
            --container "$CHAT_CONTAINER" --receipt "$RUNNER_TEMP/chat-native/populated/fixture.json" --populated
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl ui "$SIMULATOR_UDID" appearance dark
          xcrun simctl ui "$SIMULATOR_UDID" content_size accessibility-extra-extra-extra-large

      - name: Me large text, long name and dark appearance
        if: ${{ always() && !cancelled() && steps.chat_populated_fixture.outcome == 'success' }}
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          cd apps/ios
          xcodebuild test-without-building \
            -project SoloCompass.xcodeproj -scheme AccountAcceptance \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:CompanionAcceptanceUITests/ChatAndMeUITests/testMeLongNameLargeTypeAndDarkAppearance \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            -resultBundlePath "$RUNNER_TEMP/chat-native/me-accessibility.xcresult" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO 2>&1 | tee me-accessibility.log

      # Run after the guarded fixture writers: these cases create genuine local
      # recordings in this job's disposable container, never a personal device.
      - name: Inline voice recording, send and speech-denial UI tests
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/voice-composer"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl ui "$SIMULATOR_UDID" appearance light
          xcrun simctl ui "$SIMULATOR_UDID" content_size large
          xcrun simctl privacy "$SIMULATOR_UDID" grant microphone com.solocompass.app
          cd apps/ios
          xcodebuild test-without-building \
            -project SoloCompass.xcodeproj -scheme AccountAcceptance \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:CompanionAcceptanceUITests/VoiceComposerUITests \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 75 \
            -maximum-test-execution-time-allowance 90 \
            -resultBundlePath "$RUNNER_TEMP/voice-composer/voice.xcresult" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO VOICE_COMPOSER_OWNED_CONTAINER=1 \
            2>&1 | tee "$RUNNER_TEMP/voice-composer/test.log"
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/voice-composer/voice.xcresult" \
            > "$RUNNER_TEMP/voice-composer/summary.json"
          python3 - "$RUNNER_TEMP/voice-composer/summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          assert result["passedTests"] == 3, result
          assert result["failedTests"] == 0 and result["skippedTests"] == 0, result
          print("Inline voice UI: 3 passed, 0 failed, 0 skipped")
          PY

      - name: Upload inline voice UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voice-composer-native
          path: ${{ runner.temp }}/voice-composer
          retention-days: 7

      - name: Upload chat performance and Me evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-performance-and-me
          path: ${{ runner.temp }}/chat-native
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: apps/ios/build.log

      - name: Upload Test Log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs
          path: |
            apps/ios/test.log
            apps/ios/account-onboarding.log
            apps/ios/v4-navigation.log
            apps/ios/chat-and-me.log
            apps/ios/me-accessibility.log

      - name: Upload account UI results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: account-onboarding-results
          path: ${{ runner.temp }}/account-onboarding.xcresult
          retention-days: 7

      - name: Upload V4 native UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v4-native-ui-results
          path: ${{ runner.temp }}/v4-native
          retention-days: 7

  lint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test shared Agent runtime on host
        run: bash scripts/qa/agent-runtime-host.sh

      - name: Test chat history transactions with SwiftData
        run: bash scripts/qa/chat-history-host.sh

      - name: Long conversation production Store regressions (host)
        run: |
          swiftc -swift-version 5 -strict-concurrency=complete -warnings-as-errors -parse-as-library \
            apps/ios/SoloCompass/Models/CompanionIdentity.swift scripts/qa/companion-identity-host.swift \
            -o "$RUNNER_TEMP/companion-identity-host"
          "$RUNNER_TEMP/companion-identity-host"
          COMPANION_CHAT_ARTIFACT_DIR="$RUNNER_TEMP/chat-host" bash scripts/qa/companion-chat-host.sh
          python3 -m unittest discover -s scripts/qa -p test_chat_performance_fixture.py
          python3 -m unittest discover -s scripts/qa -p test_chat_hang_capture.py

      - name: Test idle audio cleanup and session ownership (host)
        run: python3 scripts/qa/companion-audio-host.py --output "$RUNNER_TEMP/chat-host/audio"

      - name: Test native scroll-position value semantics (host)
        run: python3 scripts/qa/companion-scroll-position-host.py --output "$RUNNER_TEMP/chat-host/position"

      - name: Upload chat host metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-chat-host
          path: ${{ runner.temp }}/chat-host
          retention-days: 7

      - name: Install SwiftLint
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install swiftlint

      - name: Run SwiftLint
        run: |
          cd apps/ios
          swiftlint --strict 2>&1 | tee swiftlint.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "⚠️ SwiftLint found issues (non-blocking for MVP)"
          fi

      # Full local iOS policy suite with fake subprocesses only — no Xcode
      # build, no simulator, no heavy runner. This macOS job is where the
      # macOS-only tests (dev-ios-session reexec, /usr/bin/shlock reservation)
      # actually run: any skip here is an error, so a skipped test can never
      # be read as a passed one.
      - name: Local iOS policy tests (native fakes, no skips allowed)
        run: |
          python3 - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("scripts/ios", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for test, reason in result.skipped:
              print(f"skipped: {test.id()} — {reason}", file=sys.stderr)
          if result.skipped:
              print(
                  f"error: {len(result.skipped)} tests skipped on the macOS runner; "
                  "the native policy tests must run here",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swiftlint-report
          path: apps/ios/swiftlint.log

      - name: Map query replacement caller regression (host boundaries)
        run: |
          python3 scripts/qa/v4-map-query-host.py \
            --artifact-dir "$RUNNER_TEMP" \
            --run-label v4-query-race
          python3 scripts/qa/v4-map-query-host.py \
            --artifact-dir "$RUNNER_TEMP" \
            --scenario message-reveal \
            --run-label v4-message-reveal

      - name: Upload map query caller evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v4-query-caller-host
          path: |
            ${{ runner.temp }}/v4-query-race/*.json
            ${{ runner.temp }}/v4-query-race/*.log
            ${{ runner.temp }}/v4-query-race/*.swift
            ${{ runner.temp }}/v4-message-reveal/*.json
            ${{ runner.temp }}/v4-message-reveal/*.log
            ${{ runner.temp }}/v4-message-reveal/*.swift
          retention-days: 7

  ralph:
    name: Ralph Continuous Dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/ios-mvp'
    runs-on: macos-latest
    needs: [build-and-test]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.246

      - name: Run Ralph
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd scripts/ralph
          ./ralph.sh --tool claude 3

      - name: Push Changes
        run: |
          git push origin feat/ios-mvp || echo "No changes to push"
