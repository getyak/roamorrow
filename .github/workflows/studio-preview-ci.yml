name: Life Studio Preview CI

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/studio-preview.yml"
      - "apps/ios/StudioPreview/**"
      - "apps/ios/StudioPreviewTests/**"
      - "apps/ios/SoloCompass/Views/Studio/**"
      - "apps/ios/SoloCompass/Tests/StudioStoreTests.swift"
      - "apps/ios/SoloCompass/Resources/Assets.xcassets/**"
      - "apps/ios/SoloCompass/Resources/en.lproj/**"
      - "apps/ios/SoloCompass/Resources/zh-Hans.lproj/**"
      - "scripts/ios/select-simulator.py"
      - ".github/workflows/studio-preview-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/ios/studio-preview.yml"
      - "apps/ios/StudioPreview/**"
      - "apps/ios/StudioPreviewTests/**"
      - "apps/ios/SoloCompass/Views/Studio/**"
      - "apps/ios/SoloCompass/Tests/StudioStoreTests.swift"
      - "apps/ios/SoloCompass/Resources/Assets.xcassets/**"
      - "apps/ios/SoloCompass/Resources/en.lproj/**"
      - "apps/ios/SoloCompass/Resources/zh-Hans.lproj/**"
      - "scripts/ios/select-simulator.py"
      - ".github/workflows/studio-preview-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-build-and-test:
    name: Preview build, unit and UI tests
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcode_path="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode_path"
          xcodebuild -version

      - name: Select one available iPhone
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/preview-simulators.json"
          selected="$(python3 scripts/ios/select-simulator.py \
            --json-file "$RUNNER_TEMP/preview-simulators.json" --preferred "iPhone 17 Pro")"
          python3 - "$selected" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          selected = json.loads(sys.argv[1])
          with open(sys.argv[2], "a") as output:
              output.write(f"udid={selected['udid']}\n")
          PY

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Generate standalone preview project
        working-directory: apps/ios
        run: xcodegen generate --spec studio-preview.yml

      - name: Build preview and both test targets
        shell: bash
        working-directory: apps/ios
        env:
          PREVIEW_SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/life-studio-preview"
          xcodebuild build-for-testing \
            -project LifeStudioPreview.xcodeproj -scheme LifeStudioPreview \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$PREVIEW_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/life-studio-preview/DerivedData" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/life-studio-preview/build.log"

      - name: Run standalone StudioStore unit tests
        shell: bash
        working-directory: apps/ios
        env:
          PREVIEW_SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project LifeStudioPreview.xcodeproj -scheme LifeStudioPreview \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$PREVIEW_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/life-studio-preview/DerivedData" \
            -only-testing:LifeStudioPreviewTests \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 \
            -resultBundlePath "$RUNNER_TEMP/life-studio-preview/UnitTests.xcresult" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/life-studio-preview/unit.log"

      - name: Run standalone StudioFlow UI test
        shell: bash
        working-directory: apps/ios
        env:
          PREVIEW_SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project LifeStudioPreview.xcodeproj -scheme LifeStudioPreview \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$PREVIEW_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/life-studio-preview/DerivedData" \
            -only-testing:LifeStudioPreviewUITests \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 \
            -resultBundlePath "$RUNNER_TEMP/life-studio-preview/UITests.xcresult" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/life-studio-preview/ui.log"

      - name: Verify both suites actually ran with no skipped tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in UnitTests UITests; do
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/life-studio-preview/$suite.xcresult" \
              > "$RUNNER_TEMP/life-studio-preview/$suite-summary.json"
          done
          python3 - "$RUNNER_TEMP/life-studio-preview" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          for suite, minimum in [("UnitTests", 4), ("UITests", 1)]:
              summary = json.loads((root / f"{suite}-summary.json").read_text())
              counts = [summary.get(key) for key in (
                  "totalTestCount", "passedTests", "failedTests", "skippedTests", "expectedFailures"
              )]
              if any(type(value) is not int or value < 0 for value in counts):
                  raise SystemExit(f"{suite}: missing or invalid test counts")
              total, passed, failed, skipped, expected_failures = counts
              if summary.get("result") != "Passed" or passed < minimum or total != passed or any(
                  [failed, skipped, expected_failures]
              ):
                  raise SystemExit(f"{suite}: incomplete or failing suite: {summary}")
              print(f"{suite}: {passed} passed, no failures/skips/expected failures")
          PY

      - name: Upload preview logs and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: life-studio-preview-results
          path: |
            ${{ runner.temp }}/life-studio-preview/*.log
            ${{ runner.temp }}/life-studio-preview/*-summary.json
            ${{ runner.temp }}/life-studio-preview/*.xcresult
          retention-days: 7
          if-no-files-found: warn
