<style>
:root{--ink:#3b473f;--paper:#f8f5ed;--accent:#95553e}*{box-sizing:border-box}body{margin:0;background:#e9e6de;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;background:none;border:0;min-height:42px}button:disabled{opacity:.3;cursor:default}.shell{max-width:430px;min-height:100dvh;margin:auto;background:var(--paper);padding:24px 24px 110px;position:relative}.review{font-size:10px;letter-spacing:1px;color:#7d7e73;margin:0 0 18px;display:flex;justify-content:space-between}.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand strong{font:500 25px Georgia,'Songti SC',serif;letter-spacing:5px}.brand span{font-size:11px;color:#83887c}.eyebrow{font:10px monospace;letter-spacing:3px;color:var(--accent)}h1{font:400 29px/1.55 Georgia,'Songti SC','Noto Serif CJK SC',serif;letter-spacing:1px;margin:10px 0}p.subtitle{font-size:12px;line-height:1.8;color:#808275;margin:0 0 25px}.board{width:100%;aspect-ratio:.82;background:#e8e3d4;position:relative;overflow:hidden;touch-action:none;border-radius:3px;isolation:isolate}.board::before{content:'';position:absolute;inset:18px;border:1px solid #3b473f20;pointer-events:none}.board-label{position:absolute;left:28px;top:30px;font:8px monospace;letter-spacing:1.8px;opacity:.42;pointer-events:none}.piece{position:absolute;width:38%;transform:translate(-50%,-50%) rotate(var(--angle)) scale(var(--scale));user-select:none;touch-action:none;cursor:grab;filter:drop-shadow(2px 8px 7px #362e2524);padding:0;min-height:0}.piece:focus-visible{outline:2px solid var(--accent);outline-offset:8px}.piece img{display:block;width:100%;pointer-events:none}.piece.book{height:43%;background:var(--cover,#596e5e);text-align:left;color:#f4edda;border-left:8px solid #0002;border-right:3px solid #e9e5d6;border-radius:2px;padding:20px 15px;display:flex;flex-direction:column;justify-content:space-between}.book b{font:400 22px/1.5 Georgia,'Songti SC',serif;white-space:pre-wrap;overflow:hidden}.book small{font:7px/1.7 monospace;letter-spacing:1.4px}.piece.note{padding:20px;background:#faf2d5;font:16px/1.8 Georgia,'Songti SC',serif;white-space:pre-wrap;text-align:left;overflow-wrap:anywhere}.note::before{content:'';width:42px;height:13px;background:#fff7;position:absolute;top:-7px;left:calc(50% - 21px)}.piece.photo{background:white;padding:8px 8px 14px}.piece.photo img{height:130px;object-fit:cover}.photo span{display:block;font:11px Georgia,'Songti SC',serif;margin-top:8px}.titlebar{display:flex;align-items:center;gap:8px;margin:9px 0 5px}.titlebar #title{font:16px Georgia,'Songti SC',serif;text-align:left;flex:1;min-width:0}.icon{font-size:22px;width:38px}.swatches{display:flex;align-items:center;gap:8px}.swatch{width:29px;min-height:29px;border:4px solid var(--paper);border-radius:50%;outline:1px solid #3b473f30}.hint{margin-left:auto;font-size:10px;color:#818476}.collection{border-top:1px solid #3b473f25;margin-top:25px;padding-top:20px}.sectiontitle{display:flex;justify-content:space-between;align-items:center;font:17px Georgia,'Songti SC',serif}.sectiontitle small{font:11px monospace;color:#8a8a7a}.items{display:flex;overflow-x:auto;gap:12px;padding:16px 0}.item{flex:0 0 79px;text-align:center;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thumb{width:79px;height:75px;margin-bottom:9px;background:#ffffff80;display:grid;place-items:center;font:22px Georgia,serif}.thumb img{max-width:65px;max-height:65px}.walk{display:flex;width:100%;text-align:left;align-items:center;gap:14px;padding:20px 0}.walk .map{font-size:25px}.walk b{display:block;font:16px Georgia,'Songti SC',serif;margin-bottom:6px}.walk small{font-size:10px;color:#888878}.walk .arrow{margin-left:auto}.dock{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);padding:14px 24px max(18px,env(safe-area-inset-bottom));background:#f8f5edf5;display:flex;gap:12px;align-items:center;border-top:1px solid #ffffffaa}.primary{border-radius:30px;background:var(--ink);color:white;padding:15px 24px;flex:1}.dock .more{width:35px}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:30px}.empty h2{font:22px Georgia,'Songti SC',serif}.empty p{line-height:1.9;font-size:12px;color:#7b7e6e}.empty button{border:1px solid #3b473f40;border-radius:28px;margin-top:10px;font-size:12px}.modal{position:fixed;inset:0;z-index:20;background:#21251f55;display:flex;align-items:end;justify-content:center;backdrop-filter:blur(5px)}.modal[hidden]{display:none}.panel{width:min(430px,100%);max-height:85dvh;overflow-y:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:24px}.panel h2{font:23px Georgia,'Songti SC',serif;margin:0 0 20px}.panel header{display:flex;justify-content:space-between;align-items:baseline}.panel label{display:block;font-size:12px;margin:18px 0 8px}.panel input[type=text],.panel textarea{width:100%;background:white;border:1px solid #3b473f25;padding:12px;border-radius:8px;color:var(--ink)}.panel input[type=range]{width:100%;accent-color:var(--ink)}.panel .row{display:flex;gap:8px}.panel .row button{flex:1;border:1px solid #3b473f30;border-radius:10px}.panel .choice{display:block;width:100%;padding:15px 0;text-align:left;border-bottom:1px solid #3b473f20}.panel .fine{font-size:11px;line-height:1.8;color:#7d8073}.danger{color:#a04232}#toast{position:fixed;z-index:40;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:13px 20px;border-radius:20px;font-size:12px;max-width:350px;display:none}.exported{width:100%;height:auto;display:block;margin-bottom:20px}.record{font:11px/1.7 monospace;color:#838378;margin-top:15px} @media(min-width:600px){.shell{margin:28px auto;min-height:900px;border-radius:26px;box-shadow:0 20px 70px #39392c16}.dock{border-radius:22px 22px 0 0}.review::after{content:'DESIGN REVIEW · v0.1';font:9px monospace;letter-spacing:0}}@media(prefers-reduced-motion:no-preference){button{transition:opacity .15s}.modal{animation:show .18s}@keyframes show{from{opacity:0}to{opacity:1}}}

<main class="shell"><div class="review">可交互设计预览</div><header class="brand"><strong>♧ 小木</strong><span>一方自己的天地</span></header><div class="eyebrow">LIFE, COLLECTED.</div><h1>把喜欢的日常，<br>慢慢住进来。</h1><p class="subtitle">一杯咖啡、一本书、一片偶然遇见的风景。</p><div id="board" class="board" aria-label="自由布置画布"></div><div class="titlebar"><button id="title"></button><button class="icon" id="undo" aria-label="撤销">↶</button><button class="icon" id="share" aria-label="导出作品">↥</button></div><div class="swatches"><button class="swatch" data-paper="0" style="background:#e8e3d4" aria-label="米白纸面"></button><button class="swatch" data-paper="1" style="background:#cfd9cc" aria-label="苔绿纸面"></button><button class="swatch" data-paper="2" style="background:#decec2" aria-label="陶土纸面"></button><span class="hint">拖动摆放 · 轻点修改</span></div><section class="collection"><div class="sectiontitle">收进来的小事<small id="count"></small></div><div id="items" class="items"></div></section><button class="walk" id="walk"><span class="map">⌁</span><span><b>出去走走</b><small>寻找下一份生活的灵感。</small></span><span class="arrow">↗</span></button><p class="record">浏览器预览 · 素材仅保存在当前浏览器<br>iPhone 原生版本另有本机物件提取能力。</p></main><nav class="dock"><button class="icon" id="walk2" aria-label="探索说明">⌁</button><button class="primary" id="collect">＋ 收进一点生活</button><button class="more" id="reset" aria-label="清空空间">···</button></nav><div id="modal" class="modal" hidden><section id="panel" class="panel" role="dialog" aria-modal="true" aria-label="编辑空间"></section></div><input id="file" type="file" accept="image/*" hidden><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),key='xiaomu-studio-review-v1',papers=['#e8e3d4','#cfd9cc','#decec2'],covers=['#596e5e','#99573f','#57697d'];let history=[],doc={title:'我的小小世界',paper:0,background:null,pieces:[]},readable=true,backgroundImport=false;
try{const saved=localStorage.getItem(key);if(saved)doc=JSON.parse(saved)}catch{readable=false;setTimeout(()=>toast('旧作品无法读取，已保留原数据。请勿清除浏览器数据。'),300)}
function clone(v){return JSON.parse(JSON.stringify(v))}function save(next){if(!readable)return toast('暂时无法写入，请保留原数据。');try{localStorage.setItem(key,JSON.stringify(next));history.push(clone(doc));if(history.length>20)history.shift();doc=next;render();return true}catch{toast('未能保存，可能已超出浏览器容量。原作品没有改变。');return false}}function mutate(f){let next=clone(doc);f(next);return save(next)}function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',3800)}function close(){$('#modal').hidden=true}function modal(html){$('#panel').innerHTML=html;$('#modal').hidden=false;$('#panel').querySelector('[data-close]')?.addEventListener('click',close)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function piece(kind,title,extra={}){return {id:crypto.randomUUID(),kind,title,detail:'',x:.5,y:.5,scale:1,angle:0,color:0,...extra}}
function art(p){if(p.kind==='coffee')return '<img alt="" src="coffee.png">';if(p.kind==='photo')return '<img alt="" src="'+p.image+'"><span>'+esc(p.title)+'</span>';if(p.kind==='book')return '<b>'+esc(p.title)+'</b><small>'+esc(p.detail)+'</small>';return esc(p.title)}
function render(){const board=$('#board');board.style.backgroundColor=papers[doc.paper];board.style.backgroundImage=doc.background?'url("'+doc.background+'")':'';board.style.backgroundSize='cover';board.style.backgroundPosition='center';board.innerHTML='<div class="board-label">XIAOMU / PRIVATE COLLECTION</div>';doc.pieces.forEach(p=>{let el=document.createElement('button');el.className='piece '+p.kind;el.setAttribute('aria-label',p.title);el.innerHTML=art(p);el.style.cssText=`left:${p.x*100}%;top:${p.y*100}%;--angle:${p.angle}deg;--scale:${p.scale};--cover:${covers[p.color]}`;let start,moved=false;el.onpointerdown=e=>{start={x:e.clientX,y:e.clientY};moved=false;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>4)moved=true;el.style.left=(p.x*board.clientWidth+dx)+'px';el.style.top=(p.y*board.clientHeight+dy)+'px'};el.onpointerup=e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(moved)mutate(d=>{let a=d.pieces.find(i=>i.id===p.id);a.x=Math.max(.15,Math.min(.85,p.x+dx/board.clientWidth));a.y=Math.max(.15,Math.min(.85,p.y+dy/board.clientHeight))});else edit(p.id)};el.onpointercancel=()=>{start=null;render()};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();edit(p.id)}};board.append(el)});if(!doc.pieces.length&&!doc.background){board.insertAdjacentHTML('beforeend','<div class="empty"><h2>这里，留给你的生活。</h2><p>带回一张照片，放下一件小东西。<br>不必完美，也不必一次完成。</p><button id="sample">先玩一下示例 ↗</button></div>');$('#sample').onclick=()=>mutate(d=>{d.title='示例 · 一个慢下来的午后';d.pieces=[piece('book','日常的\n小小发现',{x:.32,y:.36,angle:-12,detail:'A LITTLE EVERYDAY'}),piece('coffee','示例咖啡',{x:.69,y:.59,angle:12,scale:1.12}),piece('note','把今天，\n留一点给自己',{x:.35,y:.75,angle:-5,scale:.85})]})}$('#title').textContent=doc.title+'  ⌁';$('#count').textContent=doc.pieces.length+' 件';$('#undo').disabled=!history.length;$('#share').disabled=!doc.pieces.length&&!doc.background;$('#items').innerHTML='';doc.pieces.forEach(p=>{let el=document.createElement('button');el.className='item';el.innerHTML='<div class="thumb">'+(p.kind==='coffee'?'<img src="coffee.png" alt="">':p.kind==='photo'?'<img src="'+p.image+'" alt="">':p.kind==='book'?'▤':'〰')+'</div>'+esc(p.title);el.onclick=()=>edit(p.id);$('#items').append(el)})}
function edit(id){const p=clone(doc.pieces.find(p=>p.id===id));modal('<header><h2>让它更像你</h2><button data-close>取消</button></header><label>名字 / 文字</label><textarea id="name" rows="3">'+esc(p.title)+'</textarea><label>来源，或想记住的一句话</label><input type="text" id="detail" value="'+esc(p.detail)+'"><label>大小 <output id="sizeValue">'+Math.round(p.scale*100)+'%</output></label><input id="size" type="range" min=".5" max="1.6" step=".05" value="'+p.scale+'"><label>角度 <output id="angleValue">'+p.angle+'°</output></label><input id="angle" type="range" min="-45" max="45" value="'+p.angle+'">'+(p.kind==='book'?'<label>书的颜色</label><div class="row">'+covers.map((c,i)=>'<button data-color="'+i+'" style="background:'+c+';color:#fff">'+['苔绿','陶土','雾蓝'][i]+'</button>').join('')+'</div>':'')+'<div class="row" style="margin-top:24px"><button id="front">移到最上层</button><button id="delete" class="danger">移出空间</button></div><button id="done" class="primary" style="width:100%;margin-top:20px">完成</button><p class="fine">保存后可撤销。浏览器预览保留完整照片；本机提取在 iPhone 原生版本实现。</p>');$('#size').oninput=e=>$('#sizeValue').textContent=Math.round(+e.target.value*100)+'%';$('#angle').oninput=e=>$('#angleValue').textContent=e.target.value+'°';document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{p.color=+b.dataset.color;toast('已选：'+b.textContent)});const commit=front=>{p.title=$('#name').value;p.detail=$('#detail').value;p.scale=+$('#size').value;p.angle=+$('#angle').value;if(mutate(d=>{if(front){d.pieces=d.pieces.filter(i=>i.id!==id);d.pieces.push(p)}else d.pieces[d.pieces.findIndex(i=>i.id===id)]=p}))close()};$('#done').onclick=()=>commit(false);$('#front').onclick=()=>commit(true);$('#delete').onclick=()=>{if(mutate(d=>d.pieces=d.pieces.filter(i=>i.id!==id)))close()}}
$('#collect').onclick=()=>{modal('<header><h2>收进一点生活</h2><button data-close>完成</button></header><button class="choice" id="addPhoto">▧　 一张照片 / 一件物品</button><button class="choice" id="addScenery">⌁　 把风景变成背景</button><button class="choice" id="addBook">▤　 放一本自己的书</button><button class="choice" id="addNote">〰　 留一句自己的话</button><p class="fine">素材保存在当前浏览器，不会发送给 AI 服务。<br>没有上传、账号或订阅要求。</p>');$('#addPhoto').onclick=()=>{backgroundImport=false;$('#file').click()};$('#addScenery').onclick=()=>{backgroundImport=true;$('#file').click()};for(const [sel,kind,title]of [['#addBook','book','我的一本书'],['#addNote','note','今天，想留下……']])$(sel).onclick=()=>{let p=piece(kind,title);if(mutate(d=>d.pieces.push(p)))edit(p.id)}};
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const bmp=await createImageBitmap(f),scale=Math.min(1,1200/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=bmp.width*scale;c.height=bmp.height*scale;c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close();const data=c.toDataURL('image/jpeg',.86);let p=piece('photo','今天的小发现',{image:data});if(mutate(d=>{if(backgroundImport)d.background=data;else d.pieces.push(p)})){close();if(!backgroundImport)edit(p.id)}}catch{toast('这张照片无法读取，请换一张试试。')}finally{e.target.value=''}};
$('#undo').onclick=()=>{if(!history.length)return;const prev=history[history.length-1];try{localStorage.setItem(key,JSON.stringify(prev));doc=history.pop();render()}catch{toast('撤销未能保存，请重试。')}};document.querySelectorAll('[data-paper]').forEach(b=>b.onclick=()=>mutate(d=>{d.paper=+b.dataset.paper;d.background=null}));$('#title').onclick=()=>{modal('<header><h2>空间的名字</h2><button data-close>取消</button></header><input id="newTitle" type="text" value="'+esc(doc.title)+'"><button class="primary" id="saveTitle" style="width:100%;margin-top:20px">保存</button>');$('#saveTitle').onclick=()=>{if(mutate(d=>d.title=$('#newTitle').value||'我的小小世界'))close()}};$('#reset').onclick=()=>{modal('<h2>清空这个空间？</h2><p class="fine">本次打开期间可以撤销。</p><div class="row"><button data-close>保留作品</button><button class="danger" id="clear">清空空间</button></div>');$('#clear').onclick=()=>{if(mutate(d=>{d.pieces=[];d.background=null;d.title='我的小小世界'}))close()}};$('#walk').onclick=$('#walk2').onclick=()=>modal('<header><h2>从生活里，带点什么回来。</h2><button data-close>知道了</button></header><p class="fine">在原生 App 中，这里通向小木已有的地图探索。这个设计预览不模拟地图数据，也不会请求你的位置。</p>');$('#modal').onclick=e=>{if(e.target===$('#modal'))close()};document.onkeydown=e=>{if(e.key==='Escape')close()};
async function loadImage(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}function lines(ctx,text,x,y,width,lineHeight){let row='',line=0;for(const ch of text){if(ch==='\n'||ctx.measureText(row+ch).width>width){ctx.fillText(row,x,y+line*lineHeight);line++;row=ch==='\n'?'':ch}else row+=ch;if(line>5)break}ctx.fillText(row,x,y+line*lineHeight)}
$('#share').onclick=async()=>{try{const c=document.createElement('canvas');c.width=1000;c.height=1400;let g=c.getContext('2d');g.fillStyle='#f8f5ed';g.fillRect(0,0,1000,1400);g.save();g.translate(50,50);const w=900,h=w/.82;g.fillStyle=papers[doc.paper];g.fillRect(0,0,w,h);g.beginPath();g.rect(0,0,w,h);g.clip();if(doc.background){let i=await loadImage(doc.background),s=Math.max(w/i.width,h/i.height);g.drawImage(i,(w-i.width*s)/2,(h-i.height*s)/2,i.width*s,i.height*s)}else{g.strokeStyle='#3b473f33';g.strokeRect(42,42,w-84,h-84);g.fillStyle='#828575';g.font='18px monospace';g.fillText('XIAOMU / PRIVATE COLLECTION',68,78)}for(const p of doc.pieces){g.save();g.translate(p.x*w,p.y*h);g.rotate(p.angle*Math.PI/180);g.scale(p.scale,p.scale);let pw=w*.38;g.shadowColor='#30251b25';g.shadowBlur=16;g.shadowOffsetY=16;if(p.kind==='coffee'){let i=await loadImage('coffee.png');g.drawImage(i,-pw/2,-pw/2,pw,pw)}else if(p.kind==='book'){let ph=h*.43;g.fillStyle=covers[p.color];g.fillRect(-pw/2,-ph/2,pw,ph);g.shadowColor='transparent';g.fillStyle='#f4edda';g.font='48px Georgia,serif';lines(g,p.title,-pw/2+35,-ph/2+80,pw-65,65);g.font='17px monospace';lines(g,p.detail,-pw/2+35,ph/2-55,pw-60,22)}else if(p.kind==='note'){g.fillStyle='#faf2d5';g.fillRect(-pw/2,-100,pw,210);g.shadowColor='transparent';g.fillStyle='#3b473f';g.font='36px Georgia,serif';lines(g,p.title,-pw/2+35,-35,pw-65,53)}else{let i=await loadImage(p.image),ph=pw*1.1;g.fillStyle='white';g.fillRect(-pw/2,-ph/2,pw,ph);g.shadowColor='transparent';let iw=pw-36,ih=ph-80,s=Math.max(iw/i.width,ih/i.height);g.save();g.beginPath();g.rect(-iw/2,-ph/2+18,iw,ih);g.clip();g.drawImage(i,-i.width*s/2,-ph/2+18+(ih-i.height*s)/2,i.width*s,i.height*s);g.restore();g.fillStyle='#3b473f';g.font='25px Georgia,serif';g.fillText(p.title,-pw/2+20,ph/2-25,pw-40)}g.restore()}g.restore();g.fillStyle='#3b473f';g.font='36px Georgia,serif';g.fillText(doc.title,55,1235,890);g.font='21px sans-serif';g.fillStyle='#848476';g.fillText('小木 · 把日常，住成自己的样子',55,1290);const url=c.toDataURL('image/png');modal('<header><h2>你的这片日常</h2><button data-close>完成</button></header><img class="exported" src="'+url+'" alt="导出的作品"><a class="primary" href="'+url+'" download="小木-我的小小世界.png" style="display:block;text-align:center;text-decoration:none">保存作品 PNG</a><p class="fine">只导出作品，不会自动发布到社交平台。</p>')}catch{toast('导出失败，请通过本地预览服务打开后重试。')}};render();
</script></html>
