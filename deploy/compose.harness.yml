# DeepSeek onboarding harness — private local runtime (TEST RUNTIME ONLY).
#
# Project name is fixed: roamorrow-harness-local
# API: http://127.0.0.1:4437 (loopback only; Tailscale HTTPS is layered on top
#      by the parent's deployment, never by this file).
# PostgreSQL: no host ports at all — reachable only on the compose network.
# restart: "no" everywhere: this stack is a test runtime, never a service.
#
# Real secrets live in deploy/harness.runtime-env (git-ignored, provided
# outside source). Copy deploy/harness.runtime-env.example and fill it in.
# Run via scripts/harness/*.sh which source that file without printing it.
name: roamorrow-harness-local

x-harness-logging: &harness-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: "no"
    mem_limit: 256m
    cpus: 1
    logging: *harness-logging
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "log_statement=none"]
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-harness}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private runtime env}"
      POSTGRES_DB: "${POSTGRES_DB:-harness}"
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - harness_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-harness}\" -d \"$${POSTGRES_DB:-harness}\""]
      interval: 5s
      timeout: 3s
      retries: 24
    # Intentionally no ports: the private database never binds a host port.

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: "no"
    mem_limit: 256m
    cpus: 1
    logging: *harness-logging
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - harness.runtime-env
    environment:
      PORT: "8080"
      HARNESS_MIGRATIONS_DIR: /app/migrations/harness
    ports:
      - "127.0.0.1:4437:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  harness_pgdata:
