name: LifeStudioPreview
options:
  bundleIdPrefix: com.solocompass
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
targets:
  LifeStudioPreview:
    type: application
    platform: iOS
    sources:
      - path: SoloCompass/Views/Studio
      - path: StudioPreview
      - path: SoloCompass/Resources
        includes:
          - "Assets.xcassets/**"
          - "en.lproj/**"
          - "zh-Hans.lproj/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solocompass.studio-preview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 小木 Studio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: '0.1'
  LifeStudioPreviewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SoloCompass/Tests/StudioStoreTests.swift
    dependencies:
      - target: LifeStudioPreview
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LifeStudioPreviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StudioPreviewTests
    dependencies:
      - target: LifeStudioPreview
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LifeStudioPreview:
    build:
      targets:
        LifeStudioPreview: all
    test:
      targets:
        - LifeStudioPreviewTests
        - LifeStudioPreviewUITests
